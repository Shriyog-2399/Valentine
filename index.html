<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --pink: #ff5c8d;
  --dark-pink: #e6005c;
}

* {
  box-sizing: border-box;
  font-family: 'Poppins', system-ui, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #ffd6e8, #fff);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.container {
  width: 90%;
  max-width: 420px;
  padding: 30px 20px 50px;
  background: white;
  border-radius: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  text-align: center;
  position: relative;
}

h1 {
  color: var(--dark-pink);
  font-size: clamp(1.6rem, 5vw, 2rem);
}

p {
  color: #444;
  margin-bottom: 30px;
}

.buttons {
  position: relative;
  height: 130px;
}

button {
  padding: 14px 30px;
  font-size: 1rem;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  position: absolute;
  transition: transform 0.25s ease, left 0.25s ease, top 0.25s ease;
}

#yesBtn {
  background: var(--pink);
  color: white;
  left: 50%;
  transform: translateX(-50%);
}

#yesBtn:hover {
  background: var(--dark-pink);
  transform: translateX(-50%) scale(1.08);
}

#noBtn {
  background: #eee;
  color: #555;
  left: 50%;
  top: 70px;
  transform: translateX(-50%);
}

.celebration {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.heart {
  position: absolute;
  color: var(--pink);
  animation: floatUp 4s ease forwards;
}

@keyframes floatUp {
  from {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  to {
    transform: translateY(-120vh) scale(1.6);
    opacity: 0;
  }
}

@media (hover: none) {
  #noBtn {
    transition: left 0.2s ease, top 0.2s ease;
  }
}
</style>
</head>

<body>

<div class="container" id="card">
  <h1>Will you be my Valentine? 💖</h1>
  <p>This February and forever… 🌹</p>

  <div class="buttons" id="btnArea">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 🙈</button>
  </div>
</div>

<div class="celebration" id="celebration"></div>

<script>
const noBtn = document.getElementById("noBtn");
const btnArea = document.getElementById("btnArea");
const yesBtn = document.getElementById("yesBtn");
const celebration = document.getElementById("celebration");
const card = document.getElementById("card");

/* Move No button safely inside container */
function moveNoButton() {
  const areaRect = btnArea.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();

  const maxX = areaRect.width - btnRect.width;
  const maxY = areaRect.height - btnRect.height;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

/* Desktop hover */
noBtn.addEventListener("mouseenter", moveNoButton);

/* Mobile + modern devices (finger proximity) */
btnArea.addEventListener("pointermove", (e) => {
  const btnRect = noBtn.getBoundingClientRect();
  const distance = Math.hypot(
    e.clientX - (btnRect.left + btnRect.width / 2),
    e.clientY - (btnRect.top + btnRect.height / 2)
  );

  if (distance < 80) {
    moveNoButton();
  }
});

/* Extra safety: if she still taps */
noBtn.addEventListener("pointerdown", moveNoButton);

yesBtn.addEventListener("click", () => {
  card.innerHTML = `
    <h1>Yaaay! 🎉❤️</h1>
    <p>You just made my heart the happiest 💕</p>
  `;
  launchHearts();
});

function launchHearts() {
  for (let i = 0; i < 70; i++) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.bottom = "-20px";
    heart.style.fontSize = Math.random() * 18 + 18 + "px";
    heart.style.animationDelay = Math.random() * 1.5 + "s";
    celebration.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
  }
}
</script>

</body>
</html>
